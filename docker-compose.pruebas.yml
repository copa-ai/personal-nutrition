# Solo para pruebas: cambia el `claude` del contenedor agente por docker/pruebas/claude-falso.py (no llama al modelo).
#   docker compose -f docker-compose.yml -f docker-compose.pruebas.yml up -d agente      # activar
#   docker compose up -d agente                                                          # volver al Claude real
# El modo del falso se cambia con: docker compose exec agente sh -c 'echo lento > /app/agente/modo-falso'
services:
  agente:
    environment:
      AGENTE_CLAUDE: /opt/pruebas/claude-falso.py
    volumes:
      - ./docker/pruebas:/opt/pruebas:ro,z
